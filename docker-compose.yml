# Local stack for development and self-hosting (SPEC.md §3).
#
# The `app` service is not here yet — it needs a Dockerfile and the auth slice
# before `docker compose up` can serve anything. This file currently brings up
# Postgres only:
#
#   docker compose up -d db
#
# There is deliberately no default password. A compose file that works out of
# the box with `postgres`/`postgres` is a compose file someone eventually
# exposes to a network, so `POSTGRES_PASSWORD` has to come from `.env`
# (gitignored — copy `.env.example`).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockt}
      POSTGRES_DB: ${POSTGRES_DB:-stockt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - see .env.example}
    # Loopback only. The app will reach this over the compose network by
    # service name; the published port is for psql and drizzle-kit.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockt} -d ${POSTGRES_DB:-stockt}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
